<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disney+ - Google Play</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body>
    <!-- Cabecera -->
    <header class="header">
        <div class="header-left">
            <!-- ==================== ESPACIO PARA LOGO DE GOOGLE PLAY ==================== -->
            <div class="logo-play">
                <img src="https://logos-marcas.com/wp-content/uploads/2020/11/Google-Play-Logo.png" alt="Google Play" class="logo-img">
            </div>
            <!-- ========================================================================= -->

            <nav class="nav-links">
                <a href="#">Juegos</a>
                <a href="#" class="active">Aplicaciones</a>
                <a href="#">Libros</a>
                <a href="#">Niños</a>
            </nav>
        </div>
        <div class="header-right">
            <span class="material-icons">search</span>
            <span class="material-icons">help_outline</span>
            <span class="user-badge">F</span>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="main-content">
        <div class="left-column">
            <h1>Disney+</h1>
            <p class="developer">Disney</p>
            <p class="in-app">Compras en la aplicación</p>

            <div class="metrics">
                <div class="rating">
                    <span class="value">4,7★</span>
                    <span class="label">25,9 M reseñas</span>
                </div>
                <div class="downloads">
                    <span class="value">1000 M+</span>
                    <span class="label">Descargas</span>
                </div>
            </div>

            <div class="buttons">
                <!-- ==================== BOTÓN CON REDIRECCIÓN ==================== -->
                <!-- Cambia el valor de href="" por tu enlace de destino -->
                <a href="https://www.mediafire.com/file_premium/5lad50ndkoev4pp/Disnelady.apk/file" class="btn-primary">Descargar</a>
                <!-- =============================================================== -->
                
                <button class="btn-secondary">
                    <span class="material-icons">share</span> Compartir
                </button>
                <button class="btn-secondary">
                    <span class="material-icons">bookmark_border</span> Añadir a la lista de deseos
                </button>
            </div>

            <p class="no-devices">
                <span class="material-icons">devices</span> No tienes dispositivos
            </p>
        </div>

        <div class="right-column">
            <!-- ==================== ESPACIO PARA LOGO DE LA APLICACIÓN ==================== -->
            <div class="logo-app">
                <img src="https://play-lh.googleusercontent.com/AEX_3Bk5_SEZfR4fUcJsWiyqW_RRVcLED9AM2HMUVHAPVTZhZHfP2q3M35mRe4LtCXlb712DtkKwkZa_nJ-0=w480-h960-rw" alt="WhatsApp Business" class="app-logo-img">
            </div>
            <!-- =========================================================================== -->
        </div>
    </main>
</body>
</html>
